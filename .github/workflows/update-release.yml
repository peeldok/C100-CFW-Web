name: Update Release Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-release-metadata
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Fetch latest Mystrix CFW release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-release.mjs

      - name: Commit release metadata
        run: |
          if git diff --quiet -- release.json; then
            echo "release.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.json
          git commit -m "Update Mystrix CFW release metadata"
          git push
